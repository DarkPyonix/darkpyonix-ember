name: CI

on:
  workflow_dispatch:

concurrency:
  group: dev-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  test_ose:
    uses: ./.github/workflows/test-ose.yml
    secrets: inherit
  test_windows_preview:
    uses: ./.github/workflows/test-windows-preview.yml
    secrets: inherit
  test_vscode_extension:
    uses: ./.github/workflows/test-vscode-extension.yml
    secrets: inherit
  test_intellij_plugin:
    uses: ./.github/workflows/test-intellij-plugin.yml
    secrets: inherit
