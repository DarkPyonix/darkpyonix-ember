# DarkPyonix OSE: Code-OSS (MIT) VS Code web server, renamed and pointed at Open VSX.
# See ose/README.md. Builds run here, never on a developer machine.
#
#   pull_request     -> product job only (product.json overrides + checks; seconds)
#   push / dispatch  -> product + 4-target build matrix + smoke test, artifacts uploaded
#   tag ose-v*       -> all of the above + a GitHub release with tarballs and SHA256SUMS
name: ose

on:
  pull_request:
    paths: ["ose/**", ".github/workflows/ose.yml"]
  push:
    branches: [main, develop]
    paths: ["ose/**", ".github/workflows/ose.yml"]
    tags: ["ose-v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets to build (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ose-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  product:
    name: product.json check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      node: ${{ steps.version.outputs.node }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Resolve Code-OSS tag and its Node version
        run: |
          tag="$(tr -d '[:space:]' < ose/VERSION)"
          node="$(curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/$tag/.nvmrc" | tr -d '[:space:]v')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "Code-OSS $tag, Node $node"
      - id: matrix
        name: Build matrix
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        # Linux builds run on Ubuntu 22.04 (glibc 2.35) so the native modules also load on
        # Debian 12 / Raspberry Pi OS Bookworm (glibc 2.36); building on 24.04 would not.
        # linux-arm64 = Raspberry Pi 4/5 with a 64-bit OS; ubuntu-22.04-arm is free for public
        # repos only. macos-15-intel is GitHub's last Intel macOS image (until Aug 2027).
        run: |
          all='[{"target":"linux-x64","runner":"ubuntu-22.04"},
                {"target":"linux-arm64","runner":"ubuntu-22.04-arm"},
                {"target":"darwin-arm64","runner":"macos-15"},
                {"target":"darwin-x64","runner":"macos-15-intel"}]'
          echo "matrix=$(jq -c --arg t "${TARGETS:-}" \
            '{include: [.[] | select(. as $e | $t == "" or ($t | split(",") | map(gsub("\\s";"")) | index($e.target) != null))]}' <<< "$all")" \
            >> "$GITHUB_OUTPUT"
      - name: Apply overrides and check (Open VSX, telemetry off, no MS marketplace)
        run: ose/build.sh --product-only
      - name: Tag matches ose/VERSION
        if: startsWith(github.ref, 'refs/tags/ose-v')
        run: |
          want="${{ steps.version.outputs.tag }}"
          got="${GITHUB_REF_NAME#ose-v}"
          # ose-v1.139.1 or ose-v1.139.1-dpx.2 (a rebuild of the same upstream tag)
          case "$got" in "$want"|"$want"-*) ;; *) echo "tag $GITHUB_REF_NAME does not match ose/VERSION ($want)"; exit 1 ;; esac

  build:
    name: build ${{ matrix.target }}
    needs: product
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.product.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CI: "true"
      OSE_WORK_DIR: ${{ github.workspace }}/ose/.work
      OSE_OUT_DIR: ${{ github.workspace }}/ose/dist
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # The VS Code "How to Contribute" Linux prerequisites (native node modules).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.product.outputs.node }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ose-npm-${{ matrix.target }}-${{ needs.product.outputs.tag }}
          restore-keys: ose-npm-${{ matrix.target }}-

      - name: Cache downloaded Node runtime and built-in extensions
        uses: actions/cache@v4
        with:
          path: |
            ose/.work/vscode/.build/node
            ose/.work/vscode/.build/builtInExtensions
          key: ose-dl-${{ matrix.target }}-${{ needs.product.outputs.tag }}

      - name: Build, package and smoke-test
        id: build
        run: ose/build.sh --target ${{ matrix.target }} --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ose-${{ matrix.target }}
          path: |
            ose/dist/*.tar.gz
            ose/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [product, build]
    if: startsWith(github.ref, 'refs/tags/ose-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dpx-ose-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "DarkPyonix OSE ${GITHUB_REF_NAME#ose-v}" \
            --notes "DarkPyonix OSE built from Code-OSS ${{ needs.product.outputs.tag }} (MIT, https://github.com/microsoft/vscode/tree/${{ needs.product.outputs.tag }}). Extensions gallery: Open VSX. Telemetry off. See ose/README.md for running it with proxy/dpx."
