# Builds ember server and ember node for each target on a v* tag and attaches the archives and
# SHA256SUMS to a GitHub release (SPEC NFR-R1, #72). Owner decision 2026-10-25: macOS gets ad hoc
# signing only (no Apple account, no notarization); the client app ships in every format
# compose-rust packages, and an Android APK (job "Client app (android-arm64)", #880). The client
# jobs run only when the repository variable EMBER_CLIENT_RELEASE is "true" (see the TODOs on
# the client job).
# A manual dispatch is a dry run (#880, leader 2026-11-15): it builds and packs everything a tag
# would, at ember/app/Cargo.toml's version, keeps the files as workflow artifacts for 3 days and
# checks them in "Dry run summary". Only a v* tag push runs the publish job.
name: Publish to GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      client:
        description: Include the client app (packed even when EMBER_CLIENT_RELEASE is not set)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    # The app shows ember/app's crate version and its Velopack package carries the tag's, so a
    # tag that differs fails here, before anything builds (NFR-R1, #880).
    name: Tag matches the client version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # v<version>: the pushed tag, or on a dry run the version in ember/app/Cargo.toml.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' ember/app/Cargo.toml | head -n 1)"
          fi
          bash .github/scripts/release/check-tag-version.sh "$tag" ember/app/Cargo.toml
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A dry run shows every target's failure at once; a tag stops at the first.
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ember/server
            ember/node
      - name: Build server and node
        run: |
          (cd ember/server && cargo build --release --locked)
          (cd ember/node && cargo build --release --locked)
      - name: Ad hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          for b in ember/server/target/release/ember-server ember/server/target/release/ember-exec \
                   ember/server/target/release/ember-a2a ember/node/target/release/ember-node \
                   ember/node/target/release/ember-term; do
            codesign --force --deep -s - "$b"
            codesign --verify --verbose "$b"
          done
      - name: Package
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          pack() { # crate, program...
            crate="$1"; shift
            name="ember-${crate}-${TAG}-${TARGET}"
            mkdir -p "stage/$name"
            for p in "$@"; do cp "ember/$crate/target/release/$p" "stage/$name/"; done
            tar -C stage -czf "dist/$name.tar.gz" "$name"
            (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256")
          }
          # ember-term ships next to ember-server too: the server puts that folder on the
          # OSE's PATH for VS Code tasks (SPEC FR-P5, #26).
          cp ember/node/target/release/ember-term ember/server/target/release/ember-term
          pack server ember-server ember-exec ember-a2a ember-term
          pack node ember-node ember-term
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ember-${{ matrix.target }}
          path: dist/*
          # 0 keeps the repository default for a tag run; a dry run's files go after 3 days.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && '3' || '' }}

  client:
    # TODO(compose-rust): the packagers live in compose-rust #505 (#115 macOS .app/.dmg in
    # scripts/packager-macos/package-macos, #114 Linux .AppImage in
    # scripts/packager-linux/appimage.sh and #116 Windows .msix in
    # scripts/packager-windows/Cargo.toml); the Velopack formats (Setup.exe, .msi, .pkg, .deb,
    # .rpm, Flatpak) are spec only (FR-22.6).
    # Velopack (NFR-R1, NFR-R2, #880): .github/scripts/release/pack-velopack.sh calls
    # compose-rust's scripts/package-velopack.py (on compose-rust develop since
    # DarkPyonix/compose-rust#777) for Setup.exe, the Velopack .dmg and .AppImage, the .nupkg
    # files and releases.<channel>.json, one channel per OS and architecture.
    # COMPOSE_RUST_REF is pinned to the commit that landed the Velopack packager; move it when a
    # newer packager is needed. The job runs once the variable EMBER_CLIENT_RELEASE is "true"
    # ([OWNER ACTION REQUIRED] for that variable, the tag push and external distribution).
    name: Client app (${{ matrix.target }})
    needs: version
    # A dry run packs the client unless its `client` input is off, so the first tag finds no surprise.
    if: vars.EMBER_CLIENT_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.client)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # A dry run shows every target's failure at once; a tag stops at the first.
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        include:
          - { os: macos-15, target: macos-arm64, formats: "app dmg", channel: osx-arm64 }
          - { os: windows-2022, target: windows-x86_64, formats: "zip msix", channel: win-x64 }
          - { os: ubuntu-24.04, target: linux-x86_64, formats: "AppImage", channel: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, formats: "AppImage", channel: linux-arm64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # compose-rust develop at the merge of DarkPyonix/compose-rust#777 (Velopack packager).
      COMPOSE_RUST_REF: 10590ba75945dd3ed24c06cab4dba75b55699e09
      # Matches the velopack crate in ember/app/Cargo.toml.
      VPK_VERSION: "1.2.161"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/app
      - name: Renderer system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev
      - name: Build ember-app
        run: cd ember/app && cargo build --release --locked
      # Windows' default main-thread stack is 1 MiB and the renderer overflowed it in v0.1.0 (#880).
      - name: The main thread stack is 64 MiB (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python .github/scripts/checks/pe-stack-reserve.py ember/app/target/release/ember-app.exe --min-bytes 67108864
      - uses: actions/checkout@v5
        with:
          repository: DarkPyonix/compose-rust
          ref: ${{ env.COMPOSE_RUST_REF }}
          path: compose-rust
      - name: Package the client (macOS .app and .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          python3 compose-rust/scripts/packager-macos/package-macos app \
            --manifest-dir ember/app --executable ember/app/target/release/ember-app \
            --out stage
          codesign --force --deep -s - stage/*.app
          codesign --verify --deep --verbose stage/*.app
          python3 compose-rust/scripts/packager-macos/package-macos dmg --app stage/*.app --out "dist/ember-app-${{ needs.version.outputs.tag }}-${{ matrix.target }}.dmg"
          ditto -c -k --keepParent stage/*.app "dist/ember-app-${{ needs.version.outputs.tag }}-${{ matrix.target }}.app.zip"
      - name: Package the client (Windows .zip and .msix)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive ember/app/target/release/ember-app.exe "dist/ember-app-${{ needs.version.outputs.tag }}-${{ matrix.target }}.zip"
          # The .msix is the Store channel (P2): the packager needs the identity Partner Center
          # assigns ([windows.msix] identity_name and publisher in Dioxus.toml). Until that exists
          # the release has no .msix; Setup.exe from the Velopack step is the Windows installer.
          if (Select-String -Path ember/app/Dioxus.toml -Pattern '^\s*identity_name\s*=' -Quiet) {
            # One line: this step is PowerShell, where a trailing backslash does not continue a line.
            cargo run --release --manifest-path compose-rust/scripts/packager-windows/Cargo.toml -- --project ember/app --exe ember/app/target/release/ember-app.exe --version "${{ needs.version.outputs.tag }}" --out dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No [windows.msix] identity in ember/app/Dioxus.toml: the .msix is skipped."
          }
      - name: Package the client (Linux .AppImage)
        if: runner.os == 'Linux'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          compose-rust/scripts/packager-linux/appimage.sh \
            --dioxus-toml ember/app/Dioxus.toml --exec ember-app \
            --payload ember/app/target/release/ember-app \
            --icon ember/app/assets/brand/app-icon.svg \
            --version "${TAG#v}" --out-dir dist
      # Velopack (NFR-R2, #880). vpk is a .NET tool; package-velopack.py needs Python 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      # The icon from assets/brand/app-icon.svg: an .icns on macOS, a PNG on Linux. Windows gets
      # vpk's default icon until the repository has an .ico (Dioxus.toml has no icon yet).
      - name: App icon (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install librsvg
          mkdir -p icon/Ember.iconset
          rsvg-convert -w 1024 -h 1024 ember/app/assets/brand/app-icon.svg -o icon/ember.png
          for pt in 16 32 128 256 512; do
            sips -z "$pt" "$pt" icon/ember.png --out "icon/Ember.iconset/icon_${pt}x${pt}.png" >/dev/null
            sips -z "$((pt * 2))" "$((pt * 2))" icon/ember.png --out "icon/Ember.iconset/icon_${pt}x${pt}@2x.png" >/dev/null
          done
          iconutil -c icns icon/Ember.iconset -o icon/Ember.icns
          echo "ICON=icon/Ember.icns" >> "$GITHUB_ENV"
      - name: App icon (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p icon
          rsvg-convert -w 512 -h 512 ember/app/assets/brand/app-icon.svg -o icon/ember.png
          echo "ICON=icon/ember.png" >> "$GITHUB_ENV"
      - name: Package the client with Velopack
        shell: bash
        env:
          # gh release download reads the previous feed; no release yet is not an error there.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ matrix.channel }}
          COMPOSE_RUST_DIR: compose-rust
          EXECUTABLE: ember/app/target/release/ember-app${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          PACK_VERSION="${TAG#v}" bash .github/scripts/release/pack-velopack.sh
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ember-app-${{ matrix.target }}
          path: dist/*
          # 0 keeps the repository default for a tag run; a dry run's files go after 3 days.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && '3' || '' }}

  android:
    # The Android client (NFR-R1, FR-L36, #880, leader 2026-11-15): one APK for arm64-v8a, built
    # with ember/app/scripts/build-android.sh the way compose-rust's sample job builds its APKs
    # (test-samples.yml there: dioxus-cli 0.7.10, NDK 27.1.12297006, JDK 21). Same gate as the
    # desktop client job. Signed with the release keystore when the four EMBER_ANDROID_* secrets
    # are set ([OWNER ACTION REQUIRED] to create them); otherwise debug-signed with the runner's
    # debug key, which is not kept between runs, so such an APK does not install over the last.
    # dx 0.7.10 writes versionCode 1 into every APK and the crate version as versionName.
    name: Client app (android-arm64)
    needs: version
    if: vars.EMBER_CLIENT_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.client)
    runs-on: ubuntu-24.04
    # A cold build compiles ember-app for Android, dx itself and the Gradle project.
    timeout-minutes: 150
    outputs:
      # "release" (the keystore from the secrets) or "debug" (the runner's debug key).
      signing: ${{ steps.sign.outputs.signing }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The version compose-rust builds its sample APKs with; the README asks for dx 0.7.
      DX_VERSION: "0.7.10"
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/app
          key: android
      # The Android Gradle plugin's jlink step fails on a JDK newer than 21 (build-android.sh).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the NDK
        # The runner image has an Android SDK with its licences accepted; only this NDK may be
        # missing, and that SDK's sdkmanager fetches it (as compose-rust's sample job does).
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?the runner image has no Android SDK}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-ember-${{ hashFiles('ember/app/Cargo.lock') }}
          restore-keys: gradle-android-ember-
      - name: Install the Dioxus CLI
        # Pinned, so an upstream release cannot change what a tag was built with. rust-cache keeps
        # ~/.cargo/bin, so a warm run finds it installed.
        run: |
          if ! dx --version 2>/dev/null | grep -q "^dioxus $DX_VERSION "; then
            cargo install dioxus-cli --version "$DX_VERSION" --locked --force
          fi
          dx --version
      - name: Release keystore
        id: keystore
        # dx 0.7.10 reads a keystore only from [bundle.android] in Dioxus.toml ([android.signing]
        # is parsed and ignored) and runs assembleRelease only with --release and that section.
        # The section is written into this runner's copy of Dioxus.toml, never committed. dx puts
        # the passwords through Handlebars into build.gradle.kts, which escapes = & < > " ' and `,
        # and Kotlin reads $ in a string, so only [A-Za-z0-9._-] is accepted.
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EMBER_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EMBER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EMBER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice title=Android APK is debug-signed::The EMBER_ANDROID_KEYSTORE_BASE64, EMBER_ANDROID_KEYSTORE_PASSWORD, EMBER_ANDROID_KEY_ALIAS and EMBER_ANDROID_KEY_PASSWORD secrets are not all set, so the APK is signed with this runner's debug key. A later release signed with another key does not install over it: uninstall first."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for v in "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "::error::An EMBER_ANDROID_* password or alias has a character outside [A-Za-z0-9._-]; dx would write it into build.gradle.kts escaped or interpolated." >&2
              exit 1
            fi
          done
          jks="$RUNNER_TEMP/ember-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$jks"
          chmod 600 "$jks"
          # dx resolves jks_file against ember/app (seven levels above the generated app module).
          rel="$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[1], "ember/app"))' "$jks")"
          printf '\n[bundle.android]\njks_file = "%s"\njks_password = "%s"\nkey_alias = "%s"\nkey_password = "%s"\n' \
            "$rel" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> ember/app/Dioxus.toml
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Build the APK
        run: cd ember/app && ./scripts/build-android.sh --release --cargo-args=--locked
      - name: Check, name and sign-check the APK
        id: sign
        env:
          TAG: ${{ needs.version.outputs.tag }}
          KEYSTORE: ${{ steps.keystore.outputs.present }}
        run: |
          set -euo pipefail
          out=ember/app/target/dx/ember-app/release/android/app/app/build/outputs/apk
          if [ "$KEYSTORE" = true ]; then apk="$out/release/app-release.apk"; else apk="$out/debug/app-debug.apk"; fi
          [ -f "$apk" ] || { echo "::error::no APK at $apk; found:" >&2; find "$out" -name '*.apk' >&2 || true; exit 1; }
          # The name claims arm64-v8a, so the library must be there (compose-rust's sample check).
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libmain.so' \
            || { echo "::error::$apk has no lib/arm64-v8a/libmain.so" >&2; exit 1; }
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          certs="$("$bt/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then signing=debug; else signing=release; fi
          if [ "$KEYSTORE" = true ] && [ "$signing" != release ]; then
            echo "::error::the release keystore was set but the APK is debug-signed" >&2; exit 1
          fi
          if [ "$signing" = debug ]; then
            echo "::notice title=Android APK is debug-signed::$(echo "$certs" | grep -m1 'SHA-256 digest' || true)"
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          name="ember-app-$TAG-android-arm64.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          ls -l dist
      - name: Remove the keystore and the generated Gradle project
        # The generated build.gradle.kts holds the passwords; nothing of it may reach a cache.
        if: always()
        run: rm -rf "$RUNNER_TEMP/ember-release.jks" ember/app/target/dx
      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ember-app-android-arm64
          path: dist/*
          # 0 keeps the repository default for a tag run; a dry run's files go after 3 days.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && '3' || '' }}

  publish:
    name: Publish the release
    needs: [version, build, client, android]
    # Only a v* tag push publishes; a manual dispatch is a dry run and never reaches this job.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success' && (needs.client.result == 'success' || needs.client.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dpx-ember-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          ANDROID_SIGNING: ${{ needs.android.outputs.signing }}
        run: |
          # The client files are absent when the client job was skipped.
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.dmg dist/*.zip dist/*.msix dist/*.AppImage dist/*-Setup.exe dist/*.nupkg dist/releases.*.json dist/*.apk dist/SHA256SUMS)
          case "$ANDROID_SIGNING" in
            release) android="The Android APK (arm64-v8a) is signed with the project's release key; it installs over an earlier APK signed with the same key." ;;
            debug) android="The Android APK (arm64-v8a) is debug-signed: it cannot be upgraded by a later release signed with another key; uninstall first (this deletes the app's data and device key)." ;;
            *) android="" ;;
          esac
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ember ${TAG#v}" \
            --notes "ember-server and ember-node for macOS arm64, Linux x86_64 and Linux aarch64, and the client app when built, by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. macOS builds are ad hoc signed, not notarized: clear quarantine with xattr -dr com.apple.quarantine. Setup.exe is unsigned. ${android} Installed with Setup.exe, the Velopack .dmg or the Velopack .AppImage, the app updates itself from this feed. See the install guide."

  dry-run:
    # Lists every packed file with size and sha256 and fails when a target or channel lacks one a
    # tag release would upload (NFR-R1, #880). No write permission: the workflow default is read.
    name: Dry run summary
    needs: [version, build, client, android]
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: dpx-ember-*
          path: artifacts
      - name: List and check the packed files
        run: bash .github/scripts/release/dry-run-summary.sh artifacts "${{ needs.version.outputs.tag }}" "${{ inputs.client && 'true' || 'false' }}"
