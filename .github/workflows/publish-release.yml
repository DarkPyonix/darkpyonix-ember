# Builds ember server and ember node for each target on a v* tag and attaches the archives and
# SHA256SUMS to a GitHub release (SPEC NFR-R1, #72). Owner decision 2026-10-25: macOS gets ad hoc
# signing only (no Apple account, no notarization); the client app ships in every format
# compose-rust packages. The client job runs only when the repository variable
# EMBER_CLIENT_RELEASE is "true" (see the TODOs on that job).
name: Publish to GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    # The app shows ember/app's crate version and its Velopack package carries the tag's, so a
    # tag that differs fails here, before anything builds (NFR-R1, #880).
    name: Tag matches the client version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/release/check-tag-version.sh "${{ github.ref_name }}" ember/app/Cargo.toml

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, target: macos-arm64 }
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ember/server
            ember/node
      - name: Build server and node
        run: |
          (cd ember/server && cargo build --release --locked)
          (cd ember/node && cargo build --release --locked)
      - name: Ad hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          for b in ember/server/target/release/ember-server ember/server/target/release/ember-exec \
                   ember/server/target/release/ember-a2a ember/node/target/release/ember-node \
                   ember/node/target/release/ember-term; do
            codesign --force --deep -s - "$b"
            codesign --verify --verbose "$b"
          done
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          pack() { # crate, program...
            crate="$1"; shift
            name="ember-${crate}-${TAG}-${TARGET}"
            mkdir -p "stage/$name"
            for p in "$@"; do cp "ember/$crate/target/release/$p" "stage/$name/"; done
            tar -C stage -czf "dist/$name.tar.gz" "$name"
            (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256")
          }
          # ember-term ships next to ember-server too: the server puts that folder on the
          # OSE's PATH for VS Code tasks (SPEC FR-P5, #26).
          cp ember/node/target/release/ember-term ember/server/target/release/ember-term
          pack server ember-server ember-exec ember-a2a ember-term
          pack node ember-node ember-term
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ember-${{ matrix.target }}
          path: dist/*

  client:
    # TODO(compose-rust): the packagers live in compose-rust #505 (#115 macOS .app/.dmg in
    # scripts/packager-macos/package-macos, #114 Linux .AppImage in
    # scripts/packager-linux/appimage.sh and #116 Windows .msix in
    # scripts/packager-windows/Cargo.toml); the Velopack formats (Setup.exe, .msi, .pkg, .deb,
    # .rpm, Flatpak) are spec only (FR-22.6).
    # Velopack (NFR-R1, NFR-R2, #880): .github/scripts/release/pack-velopack.sh calls
    # compose-rust's scripts/package-velopack.py (branch feat/4-velopack-macos-linux until it
    # lands on develop) for Setup.exe, the Velopack .dmg and .AppImage, the .nupkg files and
    # releases.<channel>.json, one channel per OS and architecture.
    # Set COMPOSE_RUST_REF to a pinned commit and the variable EMBER_CLIENT_RELEASE to "true"
    # once #505 lands on compose-rust develop ([OWNER ACTION REQUIRED] for tag push and
    # external distribution).
    name: Client app (${{ matrix.target }})
    needs: version
    if: vars.EMBER_CLIENT_RELEASE == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, target: macos-arm64, formats: "app dmg", channel: osx-arm64 }
          - { os: windows-2022, target: windows-x86_64, formats: "zip msix", channel: win-x64 }
          - { os: ubuntu-24.04, target: linux-x86_64, formats: "AppImage", channel: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, formats: "AppImage", channel: linux-arm64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Not pinned yet: tracks compose-rust develop (see the TODO above).
      COMPOSE_RUST_REF: develop
      # Matches the velopack crate in ember/app/Cargo.toml.
      VPK_VERSION: "1.2.161"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/app
      - name: Renderer system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev
      - name: Build ember-app
        run: cd ember/app && cargo build --release --locked
      - uses: actions/checkout@v5
        with:
          repository: DarkPyonix/compose-rust
          ref: ${{ env.COMPOSE_RUST_REF }}
          path: compose-rust
      - name: Package the client (macOS .app and .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          python3 compose-rust/scripts/packager-macos/package-macos app \
            --manifest-dir ember/app --executable ember/app/target/release/ember-app \
            --out stage
          codesign --force --deep -s - stage/*.app
          codesign --verify --deep --verbose stage/*.app
          python3 compose-rust/scripts/packager-macos/package-macos dmg --app stage/*.app --out "dist/ember-app-${{ github.ref_name }}-${{ matrix.target }}.dmg"
          ditto -c -k --keepParent stage/*.app "dist/ember-app-${{ github.ref_name }}-${{ matrix.target }}.app.zip"
      - name: Package the client (Windows .zip and .msix)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive ember/app/target/release/ember-app.exe "dist/ember-app-${{ github.ref_name }}-${{ matrix.target }}.zip"
          # MSIX stays unsigned (FR-22.6 criterion 4); the install guide explains how to trust it.
          cargo run --release --manifest-path compose-rust/scripts/packager-windows/Cargo.toml -- \
            --project ember/app --exe ember/app/target/release/ember-app.exe \
            --version "${{ github.ref_name }}" --out dist
      - name: Package the client (Linux .AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          compose-rust/scripts/packager-linux/appimage.sh \
            --dioxus-toml ember/app/Dioxus.toml --exec ember-app \
            --payload ember/app/target/release/ember-app \
            --version "${GITHUB_REF_NAME#v}" --out-dir dist
      # Velopack (NFR-R2, #880). vpk is a .NET tool; package-velopack.py needs Python 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      # The icon from assets/brand/app-icon.svg: an .icns on macOS, a PNG on Linux. Windows gets
      # vpk's default icon until the repository has an .ico (Dioxus.toml has no icon yet).
      - name: App icon (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install librsvg
          mkdir -p icon/Ember.iconset
          rsvg-convert -w 1024 -h 1024 ember/app/assets/brand/app-icon.svg -o icon/ember.png
          for pt in 16 32 128 256 512; do
            sips -z "$pt" "$pt" icon/ember.png --out "icon/Ember.iconset/icon_${pt}x${pt}.png" >/dev/null
            sips -z "$((pt * 2))" "$((pt * 2))" icon/ember.png --out "icon/Ember.iconset/icon_${pt}x${pt}@2x.png" >/dev/null
          done
          iconutil -c icns icon/Ember.iconset -o icon/Ember.icns
          echo "ICON=icon/Ember.icns" >> "$GITHUB_ENV"
      - name: App icon (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p icon
          rsvg-convert -w 512 -h 512 ember/app/assets/brand/app-icon.svg -o icon/ember.png
          echo "ICON=icon/ember.png" >> "$GITHUB_ENV"
      - name: Package the client with Velopack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
          COMPOSE_RUST_DIR: compose-rust
          EXECUTABLE: ember/app/target/release/ember-app${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          PACK_VERSION="${GITHUB_REF_NAME#v}" bash .github/scripts/release/pack-velopack.sh
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ember-app-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish the release
    needs: [build, client]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.client.result == 'success' || needs.client.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dpx-ember-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The client files are absent when the client job was skipped.
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.dmg dist/*.zip dist/*.msix dist/*.AppImage dist/*-Setup.exe dist/*.nupkg dist/releases.*.json dist/SHA256SUMS)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ember ${TAG#v}" \
            --notes "ember-server and ember-node for macOS arm64, Linux x86_64 and Linux aarch64, and the client app when built, by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. macOS builds are ad hoc signed, not notarized: clear quarantine with xattr -dr com.apple.quarantine. The MSIX and Setup.exe are unsigned. Installed with Setup.exe, the Velopack .dmg or the Velopack .AppImage, the app updates itself from this feed. See the install guide."
