# Browser loop (#344): runs ember/server tests/browser.rs many times (50 by default) in one looped
# step on the CI runner, where those tests used to fail now and then. Dispatch only: it runs no
# check on push or pull request and is not a required check. Its own concurrency group, so it never
# replaces a queued CI run.
name: Browser loop

on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run tests/browser.rs
        required: false
        default: "50"

concurrency:
  group: browser-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser-loop:
    name: Browser tests in a loop (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/server
      - name: Build tests/browser.rs once
        working-directory: ember/server
        run: cargo test --locked --test browser --no-run
      - name: Run tests/browser.rs in a loop
        working-directory: ember/server
        run: |
          set -u
          case "$RUNS" in
            ''|*[!0-9]*) echo "::error::runs must be a whole number, got '$RUNS'"; exit 1 ;;
          esac
          pass=0
          fail=0
          i=1
          while [ "$i" -le "$RUNS" ]; do
            echo "::group::run $i of $RUNS"
            if cargo test --locked --test browser; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "::error::tests/browser.rs failed in run $i of $RUNS"
            fi
            echo "::endgroup::"
            i=$((i + 1))
          done
          echo "tests/browser.rs: $pass of $RUNS runs passed, $fail failed"
          echo "### Browser loop: $pass of $RUNS runs of tests/browser.rs passed, $fail failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]
