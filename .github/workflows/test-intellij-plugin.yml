name: IntelliJ plugin

on:
  push:
    paths: ["extensions/intellij-darkpyonix/**", ".github/workflows/test-intellij-plugin.yml"]
  pull_request:
    paths: ["extensions/intellij-darkpyonix/**", ".github/workflows/test-intellij-plugin.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/intellij-darkpyonix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Test
        run: ./gradlew --no-daemon test
      - name: Verify plugin structure
        run: ./gradlew --no-daemon verifyPluginStructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-darkpyonix
          path: extensions/intellij-darkpyonix/build/distributions/*.zip
