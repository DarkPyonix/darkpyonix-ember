# DarkPyonix OSE: Code-OSS (MIT) VS Code web server, renamed and pointed at Open VSX.
# See ember/ose/README.md. Builds run here, never on a developer machine.
#
#   called by ci.yml (the leader dispatches it) -> product + 5-target build matrix + smoke test,
#                       artifacts uploaded, then the live checks on each target's own runner type
#                       (Linux and macOS) and a smoke of the downloaded archive on Windows (#83)
#   tag ose-v*       -> all of the above; publish-ose.yml then releases this run's artifacts
#
# Live checks (SPEC FR-W4 acceptance step 4, NFR-W1; #83, #84): the archive this run built is
# downloaded, verified and unpacked, the Ember editor session's live tests run against it, and
# the extension regression installs the pinned list and reads the extension host log, then
# its deep run opens a webview and (once built) a debug session through the same client (#929).
name: OSE build

on:
  push:
    tags: ["ose-v*"]
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  product:
    name: Check product.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      node: ${{ steps.version.outputs.node }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      live_matrix: ${{ steps.matrix.outputs.live_matrix }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Resolve Code-OSS tag and its Node version
        run: |
          tag="$(tr -d '[:space:]' < ember/ose/VERSION)"
          node="$(curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/$tag/.nvmrc" | tr -d '[:space:]v')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "Code-OSS $tag, Node $node"
      - id: matrix
        name: Build matrix
        env:
          TARGETS: ${{ inputs.targets }}
        # Linux builds run on Ubuntu 22.04 (glibc 2.35) so the native modules also load on
        # Debian 12 / Raspberry Pi OS Bookworm (glibc 2.36); building on 24.04 would not.
        # linux-arm64 = Raspberry Pi 4/5 with a 64-bit OS; ubuntu-22.04-arm is free for public
        # repos only. macos-15-intel is GitHub's last Intel macOS image (until Aug 2027).
        # windows-x64 builds natively on windows-2022 (Visual Studio 2022 build tools, as upstream's
        # win32 pipeline uses; #83, docs/INTENT.md D49). The live tests are Unix only, so
        # live_matrix leaves Windows out and the "Smoke (windows-x64)" job checks it instead.
        run: |
          all='[{"target":"linux-x64","runner":"ubuntu-22.04"},
                {"target":"linux-arm64","runner":"ubuntu-22.04-arm"},
                {"target":"darwin-arm64","runner":"macos-15"},
                {"target":"darwin-x64","runner":"macos-15-intel"},
                {"target":"windows-x64","runner":"windows-2022"}]'
          picked="$(jq -c --arg t "${TARGETS:-}" \
            '[.[] | select(. as $e | $t == "" or ($t | split(",") | map(gsub("\\s";"")) | index($e.target) != null))]' <<< "$all")"
          echo "matrix=$(jq -c '{include: .}' <<< "$picked")" >> "$GITHUB_OUTPUT"
          echo "live_matrix=$(jq -c '{include: [.[] | select(.target | startswith("windows") | not)]}' <<< "$picked")" >> "$GITHUB_OUTPUT"
          echo "windows=$(jq -r 'any(.[]; .target == "windows-x64")' <<< "$picked")" >> "$GITHUB_OUTPUT"
      - name: Apply overrides and check (Open VSX, telemetry off, no MS marketplace)
        run: ember/ose/build.sh --product-only
      - name: Check default extensions are staged (FR-W6)
        run: ember/ose/check-extensions.sh
      - name: Extension regression harness self-test (NFR-W1)
        run: ember/ose/regress.sh --self-test
      - name: Tag matches ember/ose/VERSION
        if: startsWith(github.ref, 'refs/tags/ose-v')
        run: |
          want="${{ steps.version.outputs.tag }}"
          got="${GITHUB_REF_NAME#ose-v}"
          # ose-v1.139.1 or ose-v1.139.1-dpx.2 (a rebuild of the same upstream tag)
          case "$got" in "$want"|"$want"-*) ;; *) echo "tag $GITHUB_REF_NAME does not match ember/ose/VERSION ($want)"; exit 1 ;; esac

  build:
    name: Build (${{ matrix.target }})
    needs: product
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.product.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        # Git Bash on Windows, so build.sh runs unchanged on every target (#83).
        shell: bash
    env:
      CI: "true"
      OSE_WORK_DIR: ${{ github.workspace }}/ember/ose/.work
      OSE_OUT_DIR: ${{ github.workspace }}/ember/ose/dist
    steps:
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # Native node modules: VS Code's "How to Contribute" Linux prerequisites plus pkg-config,
        # as upstream's build/azure-pipelines/linux/steps/product-build-linux-compile.yml installs.
        # GCC 11 (Ubuntu 22.04) is enough once build.sh runs build/npm/preinstall.ts before npm ci.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 jq
          gcc --version | head -1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.product.outputs.node }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
          key: ose-npm-${{ matrix.target }}-${{ needs.product.outputs.tag }}
          restore-keys: ose-npm-${{ matrix.target }}-

      - name: Cache downloaded Node runtime and built-in extensions
        uses: actions/cache@v4
        with:
          path: |
            ember/ose/.work/vscode/.build/node
            ember/ose/.work/vscode/.build/builtInExtensions
          key: ose-dl-${{ matrix.target }}-${{ needs.product.outputs.tag }}

      - name: Build, package and smoke-test
        id: build
        env:
          # Read-only token: upstream's build fetches built-in extensions and npm packages from
          # GitHub and is rate-limited without one (upstream passes GITHUB_TOKEN the same way).
          GITHUB_TOKEN: ${{ github.token }}
        run: ember/ose/build.sh --target ${{ matrix.target }} --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dpx-ose-${{ matrix.target }}
          path: |
            ember/ose/dist/*.tar.gz
            ember/ose/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  live:
    name: Live checks (${{ matrix.target }})
    needs: [product, build]
    # Each target is checked even when another target's build failed: a missing archive fails
    # only its own leg, at the download step.
    if: ${{ !cancelled() && needs.product.result == 'success' && github.event_name != 'pull_request' && needs.product.outputs.live_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.product.outputs.live_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dpx-ose-${{ matrix.target }}
          path: ose-download

      - name: Verify the checksum and unpack
        id: ose
        run: |
          cd ose-download
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
          mkdir -p "$RUNNER_TEMP/ose"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/ose"
          dir="$(ls -d "$RUNNER_TEMP"/ose/dpx-ose-*-${{ matrix.target }} | head -1)"
          test -x "$dir/bin/dpx-ose-server"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "EMBER_OSE_SERVER=$dir/bin/dpx-ose-server" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ember/editor-conn
            ember/editor

      - name: Live connection test (handshake, management, files, extension host)
        run: cargo test --locked --manifest-path ember/editor-conn/Cargo.toml --test live_ose -- --ignored --nocapture

      - name: Live session tests (diagnostics, save, external change, explorer)
        run: cargo test --locked --manifest-path ember/editor/Cargo.toml --test live_session -- --ignored --nocapture --test-threads 1 --skip live_session_probe_hover_codelens_inline

      - name: Editor bridges and window flow, live (FR-E12)
        # #32 phase A steps 2 and 3: hover, CodeLens and inline completion from the probe extension,
        # and the window flow with redhat.vscode-yaml from Open VSX. Not a gate until its first green
        # run (gates change in their own PR).
        continue-on-error: true
        run: |
          cargo test --locked --manifest-path ember/editor/Cargo.toml --test live_session -- --ignored --nocapture --test-threads 1 live_session_probe_hover_codelens_inline
          cargo test --locked --manifest-path ember/editor/Cargo.toml --test live_window_flow -- --ignored --nocapture --test-threads 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Live debugging with ms-python.debugpy (FR-L31.42)
        # #445: a Python file stops at a breakpoint through the unmodified debugpy extension from
        # Open VSX, a variable is read and the run continues. Not a gate until its first green run
        # (gates change in their own PR); the leader flips it after that run.
        continue-on-error: true
        run: cargo test --locked --manifest-path ember/editor/Cargo.toml --test fr_l31_42_live_debug -- --ignored --nocapture

      - name: Live extension scan (FR-L31.14)
        run: cargo test --locked --manifest-path ember/editor/Cargo.toml --test fr_l31_14_live_extensions -- --ignored --nocapture

      - name: Extension regression (NFR-W1)
        # Not yet a release gate: expected.json holds unverified entries until the first real run,
        # and the owner has not confirmed the list (#84). Remove continue-on-error after that.
        continue-on-error: true
        env:
          OSE_REGRESS_OUT: ${{ runner.temp }}/regress-out
          OSE_REGRESS_CLIENT: cargo test --locked --manifest-path ember/editor/Cargo.toml --test nfr_w1_extension_regression -- --ignored --nocapture
        run: ember/ose/regress.sh "${{ steps.ose.outputs.dir }}"

      - name: Extension deep checks (NFR-W1)
        # The webview and debug checks of #929 through the same client. Not a gate until its first
        # green run; the debug check reports not-run until the client has a debug service (#445).
        continue-on-error: true
        env:
          OSE_REGRESS_MODE: deep
          OSE_REGRESS_OUT: ${{ runner.temp }}/regress-deep-out
          OSE_REGRESS_CLIENT: cargo test --locked --manifest-path ember/editor/Cargo.toml --test nfr_w1_extension_regression -- --ignored --nocapture
        run: ember/ose/regress.sh "${{ steps.ose.outputs.dir }}"

      - name: Keep the regression results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ose-regress-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/regress-out
            ${{ runner.temp }}/regress-deep-out
          if-no-files-found: ignore
          retention-days: 14

  smoke-windows:
    name: Smoke (windows-x64)
    needs: [product, build]
    # The live tests are Unix only (process groups, pkill), so Windows gets the smoke test of the
    # downloaded archive instead: checksum, unpack with the tar.exe Windows ships, start, /version,
    # Open VSX search and install (#83, docs/SPEC.md FR-W4 acceptance, Windows).
    if: ${{ !cancelled() && needs.product.result == 'success' && needs.product.outputs.windows == 'true' && github.event_name != 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          name: dpx-ose-windows-x64
          path: ose-download

      - name: Verify the checksum
        working-directory: ose-download
        run: sha256sum -c ./*.sha256

      - name: Unpack with the Windows tar.exe
        id: ose
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'ose'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $archive = Get-ChildItem ose-download -Filter 'dpx-ose-*-windows-x64.tar.gz' | Select-Object -First 1
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive.FullName -C $dest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = Get-ChildItem $dest -Directory -Filter 'dpx-ose-*-windows-x64' | Select-Object -First 1
          if (-not (Test-Path (Join-Path $dir.FullName 'bin\dpx-ose-server.cmd'))) { throw 'no bin\dpx-ose-server.cmd' }
          "dir=$($dir.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Smoke test (start, /version, Open VSX search and install)
        run: ember/ose/smoke.sh "$(cygpath -u '${{ steps.ose.outputs.dir }}')"
