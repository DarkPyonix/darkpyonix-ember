# Screen previews of the client (FR-L37, #222): the debug client with demo data is captured on
# every screen of .github/scripts/preview/screens.tsv at four sizes in light and dark, and the
# images are uploaded as a run artifact, so a reviewer (or a sub-agent without cargo) can look
# at every screen without building. Called by ci.yml (the leader dispatches it).
#
# Pairs with the mockup: side-by-side.sh joins each capture with its render of the mockup in
# docs/design/mockup/ (committed with the owner's approval, 2026-11-21), so the artifact holds
# the app captures, the mockup renders and the side-by-side pairs.
name: Screen previews

on:
  workflow_call:

permissions:
  contents: read

jobs:
  previews:
    name: Capture every screen (macos-15)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Check the preview artifact pipeline
        run: bash .github/scripts/tests/preview-artifacts.test.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/app
      # A debug build: the EMBER_CR_* review hooks that open each screen exist in debug builds only.
      - name: Build ember-app (debug)
        run: cd ember/app && cargo build --locked
      # The mockup render (Playwright, with the runner's Google Chrome) and the join (Pillow) run
      # through uv.
      - uses: astral-sh/setup-uv@v6
      - name: Capture the screens
        env:
          OUT_DIR: ${{ runner.temp }}/preview
          MOCKUP_DIR: ${{ github.workspace }}/docs/design/mockup
          # A cold runner draws the first frame slower than a warm desk Mac.
          WINDOW_TIMEOUT: "40"
        run: bash .github/scripts/preview/side-by-side.sh
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          index="$RUNNER_TEMP/preview/index.md"
          if [ -f "$index" ]; then cat "$index" >> "$GITHUB_STEP_SUMMARY"; else echo "No index.md was written." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ember-previews-macos
          path: |
            ${{ runner.temp }}/preview/index.md
            ${{ runner.temp }}/preview/app
            ${{ runner.temp }}/preview/pairs
            ${{ runner.temp }}/preview/mockup
            ${{ runner.temp }}/preview/logs
          if-no-files-found: error
          retention-days: 14
