# Windows preview of the client with demo data (#197). Manual or on a change to this workflow; builds ember-app (the compose-rust shell), bundles the renderer, and uploads one zip as a run artifact. No release, no tag.
name: Windows preview

on:
  workflow_dispatch:
  # A workflow file not yet on main cannot be dispatched, so a change to it runs it from the PR.
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/test-windows-preview.yml
      - .github/scripts/preview/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same tag as compose-rust in ember/app/Cargo.toml and Cargo.lock (dioxus-compose moves to v0.0.9 in the same change); bump all together.
  COMPOSE_RUST_RENDERER_VERSION: v0.0.10

jobs:
  preview:
    name: Build the preview zip
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ember/app
      - name: Fetch the renderer
        shell: pwsh
        run: ./.github/scripts/preview/fetch-renderer.ps1 -Version $env:COMPOSE_RUST_RENDERER_VERSION -Out "$env:RUNNER_TEMP\renderer"
      - name: Build ember-app
        env:
          COMPOSE_RUST_RENDERER_DIR: ${{ runner.temp }}\renderer
        run: cd ember/app && cargo build --release --locked
      - name: Package
        shell: pwsh
        run: ./.github/scripts/preview/package-windows.ps1 -Renderer "$env:RUNNER_TEMP\renderer" -Out dist/ember-preview-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ember-preview-windows-x64
          path: dist/ember-preview-windows-x64.zip
          retention-days: 7
