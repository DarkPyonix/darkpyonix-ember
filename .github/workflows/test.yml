# Repository checks. Rust builds and tests run here, not on developer machines.
#
#   transport-isolation  .github/scripts/checks/check-transport-isolation.sh (SPEC FR-N5), when present
#   editor-conn-pin      ember/editor-conn/src/rpc_ids.rs + PINNED_VERSION/PINNED_COMMIT match the
#                        Code-OSS tag in ember/ose/VERSION (regenerated with gen_rpc_ids.sh), when present
#   vendored-css         .github/scripts/checks/check-vendored-css.sh + check-no-has-selector.sh (D23, #143)
#   no-webview           .github/scripts/checks/check-no-webview.sh (SPEC NFR-L2), when present
#   sync-release         .github/scripts/tests/sync-release.test.sh (release keeps develop's history)
#   bench-summary        .github/scripts/bench/tests/summarize-matrix.test.sh (NFR-N1 matrix summarizer)
#   release-workflow     .github/scripts/checks/check-release-workflow.sh (SPEC NFR-R1)
#   node-units           .github/scripts/checks/check-node-units.sh + its test (SPEC FR-P6)
#   no-em-dash           .github/scripts/checks/check-no-em-dash.sh (AGENTS.md writing rules)
#   rust                 cargo test for each ember/<crate> dir that exists
#   oniguruma            the editor core links Oniguruma (a C library) on Windows and macOS too
#   windows-node-server  ember-node and ember-server binaries build on Windows (#200)
name: Test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Feature branches and PRs cancel a superseded run; develop, main and release finish every run
  # so each merge keeps its own result.
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/develop","refs/heads/main","refs/heads/release"]'), github.ref) }}

jobs:
  transport-isolation:
    name: Transport isolation (FR-N5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run .github/scripts/checks/check-transport-isolation.sh
        run: |
          if [ -f .github/scripts/checks/check-transport-isolation.sh ]; then
            bash .github/scripts/checks/check-transport-isolation.sh
          else
            echo ".github/scripts/checks/check-transport-isolation.sh not present on this ref; skipping"
          fi

  sync-release:
    name: Release sync script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run .github/scripts/tests/sync-release.test.sh
        run: bash .github/scripts/tests/sync-release.test.sh

  node-units:
    name: Node service units keep PTY keepers (FR-P6)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run .github/scripts/tests/check-node-units.test.sh
        run: bash .github/scripts/tests/check-node-units.test.sh
      - name: Run .github/scripts/checks/check-node-units.sh
        run: bash .github/scripts/checks/check-node-units.sh

  bench-summary:
    name: Bench matrix summarizer (NFR-N1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run .github/scripts/bench/tests/summarize-matrix.test.sh
        run: bash .github/scripts/bench/tests/summarize-matrix.test.sh

  no-em-dash:
    name: No em-dash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run .github/scripts/checks/check-no-em-dash.sh
        run: bash .github/scripts/checks/check-no-em-dash.sh

  release-workflow:
    name: Release workflow follows the rules (NFR-R1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/checks/check-release-workflow.sh

  vendored-css:
    name: Vendored Code-OSS CSS is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Vendored copy equals pristine plus patch (offline)
        run: bash .github/scripts/checks/check-vendored-css.sh
      - name: No :has( in Ember-owned CSS
        run: bash .github/scripts/checks/check-no-has-selector.sh

  no-webview:
    name: No webview in the launcher (NFR-L2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run .github/scripts/checks/check-no-webview.sh
        run: |
          if [ -f .github/scripts/checks/check-no-webview.sh ]; then
            bash .github/scripts/checks/check-no-webview.sh
          else
            echo ".github/scripts/checks/check-no-webview.sh not present on this ref; skipping"
          fi

  editor-conn-pin:
    name: Editor-conn pin matches OSE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate rpc_ids.rs at the ember/ose/VERSION tag and compare
        run: |
          set -euo pipefail
          if [ ! -f ember/editor-conn/scripts/gen_rpc_ids.sh ] || [ ! -f ember/ose/VERSION ]; then
            echo "ember/editor-conn/scripts/gen_rpc_ids.sh or ember/ose/VERSION not present on this ref; skipping"
            exit 0
          fi
          tag="$(tr -d '[:space:]' < ember/ose/VERSION)"
          src="$RUNNER_TEMP/vscode"
          # Shallow, blobless, sparse: only src/vs is needed (the script scans it for
          # createProxyIdentifier calls).
          git clone --quiet --depth 1 --branch "$tag" --filter=blob:none --sparse \
            https://github.com/microsoft/vscode.git "$src"
          git -C "$src" sparse-checkout set src/vs
          commit="$(git -C "$src" rev-parse HEAD)"
          echo "Code-OSS $tag = $commit"

          bash ember/editor-conn/scripts/gen_rpc_ids.sh "$src" > "$RUNNER_TEMP/generated.txt"
          sed -n '/^pub const PROXY_IDS: &\[&str\] = &\[$/,/^\];$/p' ember/editor-conn/src/rpc_ids.rs \
            | sed '1d;$d' > "$RUNNER_TEMP/current.txt"
          if [ ! -s "$RUNNER_TEMP/current.txt" ]; then
            echo "::error file=ember/editor-conn/src/rpc_ids.rs::PROXY_IDS table not found"
            exit 1
          fi

          fail=0
          if ! diff -u "$RUNNER_TEMP/current.txt" "$RUNNER_TEMP/generated.txt"; then
            echo "::error file=ember/editor-conn/src/rpc_ids.rs::PROXY_IDS differs from gen_rpc_ids.sh at Code-OSS $tag; regenerate it"
            fail=1
          fi
          if ! grep -qx "pub const PINNED_VERSION: &str = \"$tag\";" ember/editor-conn/src/lib.rs; then
            echo "::error file=ember/editor-conn/src/lib.rs::PINNED_VERSION is not \"$tag\" (ember/ose/VERSION)"
            fail=1
          fi
          if ! grep -qx "pub const PINNED_COMMIT: &str = \"$commit\";" ember/editor-conn/src/lib.rs; then
            echo "::error file=ember/editor-conn/src/lib.rs::PINNED_COMMIT is not \"$commit\" (Code-OSS $tag)"
            fail=1
          fi
          exit "$fail"

  oniguruma:
    name: Oniguruma builds (${{ matrix.os }})
    # onig_sys compiles the C library with `cc`. Linux is covered by "Cargo test (editor)"; these two
    # prove a C compiler and the library build on the other desktop platforms.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ember/editor
      - name: cargo test (Oniguruma link test)
        working-directory: ember/editor
        run: cargo test --locked --test onig_link

  windows-node-server:
    name: Windows node and server (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ember/node
            ember/server
      - name: cargo build (ember-node bins)
        run: cargo build --locked --manifest-path ember/node/Cargo.toml --bins
      - name: cargo build (ember-server bins)
        run: cargo build --locked --manifest-path ember/server/Cargo.toml --bins

  rust:
    name: Cargo test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: [server, node, transport, transfer, hub, client, bridge, editor-conn, editor, app]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - id: present
        name: Crate present?
        run: |
          if [ -f "ember/${{ matrix.crate }}/Cargo.toml" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "ember/${{ matrix.crate }}/Cargo.toml not present on this ref; skipping"; echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.present.outputs.yes == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.present.outputs.yes == 'true'
        with:
          workspaces: ember/${{ matrix.crate }}
      - name: Renderer system libraries
        if: steps.present.outputs.yes == 'true' && matrix.crate == 'app'
        # The compose-rust renderer links X11, GL, fontconfig and freetype on Linux.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev
      - name: Fetch every platform's crates
        if: steps.present.outputs.yes == 'true' && matrix.crate == 'app'
        # tests/no_webview.rs reads the whole dependency graph with `cargo metadata
        # --offline`, which needs the crates of every platform on disk, not only Linux's.
        working-directory: ember/app
        run: cargo fetch --locked
      - name: cargo test
        if: steps.present.outputs.yes == 'true'
        working-directory: ember/${{ matrix.crate }}
        run: |
          if [ -f Cargo.lock ]; then cargo test --locked; else cargo test; fi
      - name: cargo test (legacy iroh backend)
        # SPEC FR-N5: letify-link is the default backend (INTENT D36), so the plain test above
        # covers it. The iroh backend stays for one release; its suite runs with the feature on.
        # Removal is tracked in a follow-up issue.
        if: steps.present.outputs.yes == 'true' && matrix.crate == 'transport'
        working-directory: ember/transport
        run: cargo test --locked --features iroh
