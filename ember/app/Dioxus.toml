# Bundle metadata for the Ember client app. compose-rust's packagers read it: [application] and
# [bundle] for the name, identifier and descriptions, [macos] for the .app name. The version
# comes from Cargo.toml. There is no icon in the repository yet (TODO: add one and set
# `icon` under [bundle], then pass it to the packagers).

[application]
name = "Ember"
# Android (FR-L36): Ember's own Activity (data directory, debug launch settings, back) in
# place of the one the packager would write. See README.md, "Android".
android_main_activity = "android/MainActivity.kt"

# R8 runs only in a release build signed with a keystore (NFR-R1, #880). The renderer's Kotlin
# is reached from Rust over JNI and ships no keep rules, so the file turns shrinking, optimisation
# and renaming off rather than guess which classes JNI needs.
[android]
proguard_rules = ["android/proguard-keep.pro"]

[bundle]
identifier = "dev.darkpyonix.ember"
publisher = "DarkPyonix"
short_description = "Ember, a multi-provider LLM development environment."
long_description = "Ember is a multi-provider, LLM-based development environment and remote IDE client."

[macos]
bundle_name = "Ember"

# What compose-rust's Linux packager needs beyond dx's own keys (the AppImage's AppStream
# file). The licence is this repository's (LICENSE, Cargo.toml).
[linux]
categories = ["Development"]

[linux.store]
license = "Apache-2.0"
homepage = "https://github.com/DarkPyonix/darkpyonix-ember"
