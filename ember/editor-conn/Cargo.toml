[package]
name = "ember-editor-conn"
version = "0.1.0"
edition = "2021"
description = "Ember editor core: Rust client for a Code-OSS server (management + extension-host connections, remote filesystem, extension-host RPC)"
license = "Apache-2.0"

[lib]
name = "ember_editor_conn"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
