# FR-E9 protocol coverage ledger.
#
# Every MainThread* actor and method of the pinned Code-OSS (ember/editor-conn/src/actors/generated.rs,
# generated from extHost.protocol.ts) with what Ember does with it:
#   bridged  the session decodes the call and answers from its own state;
#   acked    the empty answer is correct, confirmed by a person (name and date in the actor's `note`);
#   out      out of scope; the actor's `note` says why and who decided;
#   todo     not built yet: answered with the fallback reply; a call that returns a value is recorded
#            (actor, method, count, and the extension when an argument names it).
# `fr_e9_ledger_covers_generated_protocol` fails when the generated protocol has an actor or method
# this file lacks, or this file names one the protocol does not have. A pin bump adds new methods
# here as `todo` or `out` (docs/design/POST-1-0-EDITOR-CORE.md 4.4).

