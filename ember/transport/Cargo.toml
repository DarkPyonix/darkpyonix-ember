[package]
name = "ember-transport"
version = "0.1.0"
edition = "2021"
description = "Ember transport: peer-to-peer connections behind one interface (SPEC FR-N5); the letify-link backend + in-memory fake"
license = "Apache-2.0"

[features]
default = ["letify", "http"]
# letify-link backend (SPEC FR-N5, INTENT D36): a Noise session over TCP and punched UDP paths,
# the main server as relay (INTENT D36). The legacy iroh backend is removed (#1163). The only place
# where a transport library may be referenced.
letify = ["dep:letify-link", "dep:reqwest", "dep:serde_json"]
# Serve / dial HTTP (axum, hyper) over transport streams.
http = ["dep:axum", "dep:hyper", "dep:hyper-util"]
# The NFR-N1 measurement binary.
bench = ["dep:serde_json"]

[dependencies]
async-trait = "0.1"
ed25519-dalek = "3"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# The letify connection layer, pinned to the crates.io release 3.0.7 (INTENT D36, punching):
# RelayOffer messages, RelayPairing, canonical Session::peer, close_when_revoked, QAD TCP
# dial-back, the public punch driver (letify_link::driver) that runs every punch, and with the
# `signal` feature the client of letify's signalling Worker (letify_link::signal), an auxiliary
# punch rendezvous (owner, 2026-11-23).
letify-link = { version = "=3.0.7", optional = true, features = ["relay", "signal"] }
# The hub's pkarr directory over HTTP (the same client settings as ember-hub).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

axum = { version = "0.8", optional = true, features = ["ws"] }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }

serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[[bin]]
name = "ember-transport-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]
