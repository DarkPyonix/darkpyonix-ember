[package]
name = "ember-transport"
version = "0.1.0"
edition = "2021"
description = "Ember transport: peer-to-peer connections behind one interface (SPEC FR-N5); iroh and letify-link backends + in-memory fake"
license = "Apache-2.0"

[features]
default = ["iroh", "http"]
# Real P2P backend (SPEC FR-N1). The only place iroh may be referenced (FR-N5).
iroh = ["dep:iroh", "dep:url"]
# letify-link backend (SPEC FR-N5, INTENT D36): a Noise session over TCP paths, the main server as
# relay. Selected at run time with EMBER_TRANSPORT_BACKEND=letify. The only other place, besides
# the iroh backend, where a transport library may be referenced.
letify = ["dep:letify-link", "dep:reqwest"]
# Serve / dial HTTP (axum, hyper) over transport streams.
http = ["dep:axum", "dep:hyper", "dep:hyper-util"]
# The NFR-N1 measurement binary.
bench = ["iroh", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
ed25519-dalek = "3"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

iroh = { version = "1", optional = true }
# The letify connection layer, pinned to a commit of DarkPyonix/letify (branch feat/letify-link-spec): RelayOffer messages, RelayPairing, canonical Session::peer, close_when_revoked, QAD TCP dial-back.
letify-link = { git = "https://github.com/DarkPyonix/letify", rev = "1ed5501cd2c2492a9f817eb12740864af819fbcf", optional = true, features = ["relay"] }
# The hub's pkarr directory over HTTP (the same client settings as ember-hub).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# The hub directory's pkarr URL (the type iroh's pkarr builders take).
url = { version = "2.5", optional = true }

axum = { version = "0.8", optional = true, features = ["ws"] }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }

serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[[bin]]
name = "ember-transport-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]
