pluginGroup = dev.darkpyonix.intellij
pluginVersion = 0.1.0

# Platform the plugin compiles against. 2025.3 is the last release that still ships a
# separate PyCharm Community / IntelliJ IDEA Community, and the first unified one, so
# building against it keeps both audiences (sinceBuild 253, no untilBuild).
platformVersion = 2025.3.6.1
pluginSinceBuild = 253
# PyCharm used by `./gradlew runPyCharm`.
pyCharmVersion = 2025.3

# The IDE ships the Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
