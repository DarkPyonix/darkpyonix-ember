<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarkPyonix — 워크스페이스</title>
<script>(function(){try{document.documentElement.setAttribute('data-xtheme',localStorage.getItem('xmo_theme')||'sepia');}catch(e){document.documentElement.setAttribute('data-xtheme','sepia');}})();</script>
<style>
/* 3테마(라이트/세피아/다크) — 로그인 화면과 같은 `xmo_theme` 키를 공유한다. */
:root[data-xtheme="light"]{ --bg:#f4f4f5; --card:#ffffff; --ink:#2b2b2b; --muted:#8a8a8f; --line:#ececee; --brand:#c0392b; --accent:#f5821f; --ico-bg:#fff3e8; --ico-add-bg:#eeeeee; --chip:#eeeeee; --btn2-fg:#555555; --dash:#d7d7db; --shadow:rgba(0,0,0,.10); }
:root[data-xtheme="sepia"]{ --bg:#efe6d8; --card:#fbf7f1; --ink:#3a352e; --muted:#9a8f83; --line:#e6ddd0; --brand:#b23a2e; --accent:#c8632a; --ico-bg:#f3e7d6; --ico-add-bg:#e9ddc9; --chip:#e9ddc9; --btn2-fg:#6b5f52; --dash:#d9ccb8; --shadow:rgba(120,80,50,.14); }
:root[data-xtheme="dark"]{ --bg:#1f1c19; --card:#2a2622; --ink:#e8e0d4; --muted:#a59a8c; --line:#38322c; --brand:#d0654f; --accent:#e08a4a; --ico-bg:#382e24; --ico-add-bg:#332c24; --chip:#38322c; --btn2-fg:#cabfae; --dash:#4a4038; --shadow:rgba(0,0,0,.5); }
:root{ --bg:#efe6d8; --card:#fbf7f1; --ink:#3a352e; --muted:#9a8f83; --line:#e6ddd0; --brand:#b23a2e; --accent:#c8632a; --ico-bg:#f3e7d6; --ico-add-bg:#e9ddc9; --chip:#e9ddc9; --btn2-fg:#6b5f52; --dash:#d9ccb8; --shadow:rgba(120,80,50,.14); }
*{box-sizing:border-box;} html,body{margin:0;min-height:100%;}
body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left); }

.top{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 16px;
      background:var(--bg); border-bottom:1px solid var(--line); }
.back{ border:none; background:var(--chip); color:var(--ink); width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer; flex:0 0 auto; display:none; }
.back.show{ display:block; }
.crumb{ flex:1; min-width:0; }
.crumb .b1{ font-size:17px; font-weight:800; color:var(--brand); letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crumb .b2{ font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.xtheme{ display:inline-flex; gap:3px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px; flex:0 0 auto; }
.xtheme button{ width:28px; height:28px; border:none; border-radius:999px; background:none; color:var(--muted); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
.xtheme button.on{ background:var(--brand); color:#fff; }

.wrap{ padding:14px 16px 40px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.card{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 1px 3px var(--shadow); cursor:pointer; display:flex; flex-direction:column; }
.card:active{ transform:scale(.995); }
.row{ display:flex; align-items:center; gap:10px; }
.ico{ width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--ico-bg);color:var(--accent);font-size:21px;flex:0 0 auto; }
.title{ font-size:15.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub{ font-size:11.5px; color:var(--muted); word-break:break-all; margin-top:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip{ font-size:10.5px; color:var(--muted); background:var(--chip); border-radius:999px; padding:3px 9px; }
.chip.agent{ color:var(--brand); font-weight:700; }
.prev{ border-top:1px solid var(--line); margin-top:12px; padding-top:10px; display:flex; flex-direction:column; gap:5px; }
.pline{ font-size:12px; display:flex; gap:6px; align-items:baseline; }
.pline .who{ flex:0 0 auto; font-size:10px; font-weight:700; color:var(--muted); width:40px; overflow:hidden; white-space:nowrap; }
.pline .who.a{ color:var(--accent); }
.pline .tx{ flex:1; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pline.tool .tx{ color:var(--muted); font-family:ui-monospace,Consolas,monospace; font-size:11px; }
.empty{ font-size:12.5px; color:var(--muted); padding:22px 4px; text-align:center; line-height:1.8; }
.btn{ margin-top:12px; width:100%; border:none; border-radius:10px; padding:11px; font-size:13.5px; font-weight:600; color:#fff; background:var(--brand); cursor:pointer; }
.btn.ghost{ background:var(--chip); color:var(--btn2-fg); }
.del{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; line-height:1; opacity:.7; }
.add{ border:2px dashed var(--dash); align-items:center; justify-content:center; text-align:center; color:var(--muted); min-height:186px; }
.add .ico{ background:var(--ico-add-bg); color:var(--muted); }
.filter{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:13.5px; margin-bottom:12px; }

.modal{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
.modal.open{ display:flex; }
.form{ background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:360px; }
.form h3{ margin:0 0 6px; font-size:16px; }
.form label{ display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
.form input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--bg); color:var(--ink); }
.form .frow{ display:flex; gap:10px; margin-top:18px; }
.form button{ flex:1; padding:11px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }

.log{ display:flex; flex-direction:column; gap:10px; max-width:820px; margin:0 auto; }
.msg{ max-width:86%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.msg.user{ align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:5px; }
.msg.assistant{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.tool{ align-self:flex-start; background:transparent; border:1px dashed var(--dash); color:var(--muted);
           font-family:ui-monospace,Consolas,monospace; font-size:11.5px; padding:6px 10px; }
.bar{ position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line); margin-top:16px;
      padding:10px 0 calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
.bar .btn{ margin:0; }
code{ font-family:ui-monospace,Consolas,monospace; background:var(--chip); border-radius:6px; padding:1px 5px; font-size:11.5px; }
#toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom)); z-index:20;
        display:none; padding:10px 16px; border-radius:10px; background:rgba(30,30,30,.92); color:#fff; font-size:13px; max-width:86vw; }
#toast.show{ display:block; }
</style></head>
<body>
<div class="top">
  <button class="back" id="back" type="button" aria-label="뒤로">←</button>
  <div class="crumb"><div class="b1" id="b1">DarkPyonix</div><div class="b2" id="b2">워크스페이스</div></div>
  <div class="xtheme" id="xtheme" role="group" aria-label="테마">
    <button type="button" data-t="light" title="라이트">☀</button>
    <button type="button" data-t="sepia" title="세피아">◐</button>
    <button type="button" data-t="dark" title="다크">☾</button>
  </div>
</div>
<div class="wrap" id="view"></div>
<div class="modal" id="modal"><div class="form">
  <h3>워크스페이스 추가</h3>
  <label>이름</label><input id="f-name" placeholder="My Project">
  <label>서버 URL (비우면 현재 서버)</label><input id="f-url" placeholder="http://my-pc.example.com">
  <label>폴더 경로</label><input id="f-folder" placeholder="C:\path\to\project">
  <div class="frow"><button class="btn ghost" id="m-cancel" style="margin:0">취소</button><button class="btn" id="m-save" style="margin:0">추가</button></div>
</div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';

// ---------------------------------------------------------------------------
// 화면 = 폴더(워크스페이스) → 대화 목록 → 대화 기록. 해시 라우팅이라 폰의
// 뒤로가기 버튼이 그대로 동작한다.
//   #/                          폴더 카드
//   #/w/<b64folder>             그 폴더의 에이전트 대화 목록
//   #/c/<agent>/<cid>?f=<b64>   대화 전체 기록
//
// 폴더 목록은 세 곳을 합친다.
//   1) 에이전트 대화가 있는 폴더(서버가 ~/.claude 등을 읽어 알려줌)
//   2) 서버가 기억하는 최근 워크스페이스(_xmo_recent.json)
//   3) 브라우저 localStorage 북마크(사용자가 직접 추가 — 다른 서버 URL 도 가능)
// ---------------------------------------------------------------------------
var LS = 'xmo_home_ws';
var view = document.getElementById('view');
var DATA = { workspaces: [], agents: [] };

function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/=+$/,''); }
function unb64(s){ try { return decodeURIComponent(escape(atob(s))); } catch(e){ return ''; } }
function nameOf(p){ var s = String(p||'').replace(/\\/g,'/').replace(/\/+$/,''); return s.split('/').pop() || s; }
function key(p){ return String(p||'').replace(/\\/g,'/').replace(/\/+$/,'').toLowerCase(); }
function rel(ts){
  if(!ts) return '';
  var s = Math.max(0, Date.now()/1000 - Number(ts));
  if(s < 60) return '방금';
  if(s < 3600) return Math.floor(s/60) + '분 전';
  if(s < 86400) return Math.floor(s/3600) + '시간 전';
  if(s < 86400*30) return Math.floor(s/86400) + '일 전';
  return new Date(Number(ts)*1000).toLocaleDateString('ko-KR');
}
function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function crumbs(a, b){ document.getElementById('b1').textContent = a; document.getElementById('b2').textContent = b || ''; }
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function agentName(id){
  var a = (DATA.agents || []).filter(function(x){ return x.id === id; })[0];
  return (a && a.name) || id;
}
function marks(){ try { return JSON.parse(localStorage.getItem(LS)) || []; } catch(e){ return []; } }
function saveMarks(a){ try { localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} }

function api(path){
  return fetch(path, {cache:'no-store', credentials:'same-origin'}).then(function(r){
    if(r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.href); throw new Error('unauthorized'); }
    return r.json().catch(function(){ return {ok:false, error:'응답을 해석하지 못했습니다'}; });
  });
}

// 워크스페이스 열기: 같은 서버면 바로 편집기로, 다른 서버 북마크면 그 서버 로그인으로.
function openWorkspace(ws){
  var url = (ws.url || '').replace(/\/+$/,'');
  if(url && url !== location.origin){
    location.href = url + '/login?name=' + encodeURIComponent(ws.name || nameOf(ws.folder))
                  + '&url=' + encodeURIComponent(url) + '&folder=' + encodeURIComponent(ws.folder || '');
  } else {
    location.href = '/?folder=' + encodeURIComponent(ws.folder || '');
  }
}

// --- 화면 1: 폴더 카드 -------------------------------------------------------
function mergedWorkspaces(){
  var out = [], seen = {};
  (DATA.workspaces || []).forEach(function(w){
    seen[key(w.folder)] = 1;
    out.push({folder:w.folder, name:w.name || nameOf(w.folder), url:'', updated:w.updated,
              conversations:w.conversations || 0, agents:w.agents || [], recent:w.recent || []});
  });
  marks().forEach(function(m){
    var k = key(m.folder);
    if(seen[k] && !m.url){                       // 같은 폴더가 이미 있으면 북마크 표시만 얹는다
      out.forEach(function(w){ if(key(w.folder) === k){ w.id = m.id; if(m.name) w.name = m.name; } });
      return;
    }
    if(seen[k] && m.url) return;
    seen[k] = 1;
    out.push({folder:m.folder, name:m.name || nameOf(m.folder), url:m.url || '', id:m.id,
              updated:0, conversations:0, agents:[], recent:[]});
  });
  return out;
}

function workspaceCard(w){
  var c = el('div','card');
  if(w.id){
    var del = el('button','del','×');
    del.title = '북마크에서 삭제';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      saveMarks(marks().filter(function(x){ return x.id !== w.id; }));
      render();
    });
    c.appendChild(del);
  }
  var head = el('div','row');
  head.appendChild(el('div','ico','📁'));
  var meta = el('div'); meta.style.cssText = 'flex:1;min-width:0';
  meta.appendChild(el('div','title', w.name));
  meta.appendChild(el('div','sub', (w.url ? w.url + ' · ' : '') + w.folder));
  head.appendChild(meta);
  c.appendChild(head);

  var chips = el('div','chips');
  chips.appendChild(el('span','chip', w.conversations ? w.conversations + '개 대화' : '대화 없음'));
  if(w.updated) chips.appendChild(el('span','chip', rel(w.updated)));
  (w.agents || []).forEach(function(a){ chips.appendChild(el('span','chip agent', agentName(a))); });
  c.appendChild(chips);

  var p = el('div','prev');
  if((w.recent || []).length){
    w.recent.slice(0,3).forEach(function(cv){
      var line = el('div','pline');
      line.appendChild(el('span','who', rel(cv.updated)));
      line.appendChild(el('span','tx', cv.title || '(제목 없음)'));
      p.appendChild(line);
    });
  } else {
    var line = el('div','pline');
    line.appendChild(el('span','tx','최근 대화 없음'));
    p.appendChild(line);
  }
  c.appendChild(p);

  var open = el('button','btn ghost','VS Code 로 열기');
  open.addEventListener('click', function(e){ e.stopPropagation(); openWorkspace(w); });
  c.appendChild(open);

  // 카드 본문 탭 = 대화 목록으로. 다른 서버 북마크는 대화를 읽을 수 없으니 바로 연다.
  c.addEventListener('click', function(){
    if(w.url && w.url.replace(/\/+$/,'') !== location.origin){ openWorkspace(w); return; }
    location.hash = '#/w/' + b64(w.folder);
  });
  return c;
}

function addCard(){
  var c = el('div','card add');
  c.appendChild(el('div','ico','＋'));
  c.appendChild(el('div','title','워크스페이스 추가'));
  c.appendChild(el('div','sub','폴더를 북마크에 등록'));
  c.addEventListener('click', function(){ document.getElementById('modal').classList.add('open'); });
  return c;
}

function renderHome(){
  var list = mergedWorkspaces();
  crumbs('DarkPyonix', '워크스페이스 ' + list.length + '개');
  document.getElementById('back').classList.remove('show');
  view.innerHTML = '';
  var g = el('div','grid');
  list.forEach(function(w){ g.appendChild(workspaceCard(w)); });
  g.appendChild(addCard());
  view.appendChild(g);
}

// --- 화면 2: 대화 목록 -------------------------------------------------------
function conversationCard(cv, folder){
  var c = el('div','card');
  var head = el('div','row');
  head.appendChild(el('div','ico','💬'));
  var meta = el('div'); meta.style.cssText = 'flex:1;min-width:0';
  meta.appendChild(el('div','title', cv.title || '(제목 없음)'));
  meta.appendChild(el('div','sub', rel(cv.updated) + ' · 기록 ' + (cv.message_count || 0) + '줄'));
  head.appendChild(meta);
  c.appendChild(head);

  var chips = el('div','chips');
  chips.appendChild(el('span','chip agent', agentName(cv.agent)));
  c.appendChild(chips);

  if((cv.preview || []).length){
    var p = el('div','prev');
    cv.preview.forEach(function(msg){
      var line = el('div','pline' + (msg.kind === 'tool' ? ' tool' : ''));
      line.appendChild(el('span','who' + (msg.role === 'assistant' ? ' a' : ''), msg.role === 'user' ? '나' : 'AI'));
      line.appendChild(el('span','tx', msg.text));
      p.appendChild(line);
    });
    c.appendChild(p);
  }
  c.addEventListener('click', function(){
    location.hash = '#/c/' + encodeURIComponent(cv.agent) + '/' + encodeURIComponent(cv.id) + '?f=' + b64(folder);
  });
  return c;
}

function renderConversations(folder){
  crumbs(nameOf(folder), folder);
  document.getElementById('back').classList.add('show');
  view.innerHTML = '';
  view.appendChild(el('div','empty','불러오는 중…'));

  api('/__agents/conversations?folder=' + encodeURIComponent(folder)).then(function(d){
    view.innerHTML = '';
    var list = (d && d.conversations) || [];

    var open = el('button','btn','이 워크스페이스를 VS Code 로 열기');
    open.style.marginBottom = '14px';
    open.addEventListener('click', function(){ openWorkspace({folder: folder}); });
    view.appendChild(open);

    if(!list.length){ view.appendChild(el('div','empty','이 폴더에는 아직 에이전트 대화가 없습니다.')); return; }

    var box = el('input','filter'); box.type = 'search'; box.placeholder = '대화 검색 (제목·미리보기)';
    view.appendChild(box);
    var g = el('div','grid'); view.appendChild(g);
    function paint(q){
      g.innerHTML = '';
      q = (q || '').trim().toLowerCase();
      list.filter(function(cv){
        if(!q) return true;
        var hay = (cv.title || '') + ' ' + (cv.preview || []).map(function(x){ return x.text; }).join(' ');
        return hay.toLowerCase().indexOf(q) >= 0;
      }).forEach(function(cv){ g.appendChild(conversationCard(cv, folder)); });
      if(!g.children.length) g.appendChild(el('div','empty','검색 결과가 없습니다.'));
    }
    box.addEventListener('input', function(){ paint(box.value); });
    paint('');
  }).catch(function(){ view.innerHTML = ''; view.appendChild(el('div','empty','대화 목록을 불러오지 못했습니다.')); });
}

// --- 화면 3: 대화 전체 기록 --------------------------------------------------
function renderTranscript(agent, cid, folder){
  crumbs('대화 기록', agentName(agent) + ' · ' + nameOf(folder));
  document.getElementById('back').classList.add('show');
  view.innerHTML = '';
  view.appendChild(el('div','empty','기록을 읽는 중…'));

  api('/__agents/transcript?agent=' + encodeURIComponent(agent) + '&cid=' + encodeURIComponent(cid))
    .then(function(d){
      view.innerHTML = '';
      if(!d || !d.ok){
        view.appendChild(el('div','empty', (d && d.error) || '기록을 읽지 못했습니다.'));
      } else {
        var log = el('div','log');
        (d.messages || []).forEach(function(msg){
          var cls = msg.kind === 'tool' ? 'tool' : (msg.role === 'user' ? 'user' : 'assistant');
          log.appendChild(el('div','msg ' + cls, msg.text));
        });
        if(!log.children.length) log.appendChild(el('div','empty','표시할 발화가 없습니다.'));
        view.appendChild(log);
      }
      var bar = el('div','bar');
      var go = el('button','btn','VS Code 에서 이어가기');
      go.addEventListener('click', function(){ resumeIn(agent, cid, folder); });
      bar.appendChild(go);
      view.appendChild(bar);
    })
    .catch(function(){ view.innerHTML = ''; view.appendChild(el('div','empty','기록을 읽지 못했습니다.')); });
}

// 브라우저에서 VS Code 의 터미널에 명령을 대신 쳐 넣을 방법은 없다. 그래서 이어가기
// 명령을 클립보드에 넣고, 워크스페이스를 열면서 에이전트 패널을 자동으로 띄운다
// (main.py 의 프레임 래퍼가 ?agent=&cid= 를 보고 처리). 터미널에 붙여넣으면 이어진다.
function resumeIn(agent, cid, folder){
  api('/__agents/resume?agent=' + encodeURIComponent(agent) + '&cid=' + encodeURIComponent(cid))
    .then(function(d){
      var cmd = d && d.resume && d.resume.command;
      var go = function(){
        location.href = '/?folder=' + encodeURIComponent(folder)
                      + '&agent=' + encodeURIComponent(agent) + '&cid=' + encodeURIComponent(cid);
      };
      if(cmd && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(cmd).then(function(){
          toast('이어가기 명령을 복사했습니다 — 터미널에 붙여넣으세요');
          setTimeout(go, 800);
        }, function(){ toast('이어가기 명령: ' + cmd); setTimeout(go, 1500); });
      } else if(cmd){
        toast('이어가기 명령: ' + cmd); setTimeout(go, 1500);
      } else { go(); }
    }).catch(function(){});
}

// --- 라우터 ------------------------------------------------------------------
function route(){
  var h = location.hash.replace(/^#/, '') || '/';
  var qs = '', qi = h.indexOf('?');
  if(qi >= 0){ qs = h.slice(qi + 1); h = h.slice(0, qi); }
  var p = h.split('/').filter(Boolean);
  if(p[0] === 'w') return renderConversations(unb64(p[1] || ''));
  if(p[0] === 'c'){
    var f = /(^|&)f=([^&]*)/.exec(qs);
    return renderTranscript(decodeURIComponent(p[1] || ''), decodeURIComponent(p[2] || ''), f ? unb64(f[2]) : '');
  }
  return renderHome();
}
function render(){ route(); }
document.getElementById('back').addEventListener('click', function(){ history.back(); });
window.addEventListener('hashchange', route);

// --- 워크스페이스 추가 모달 --------------------------------------------------
document.getElementById('m-cancel').addEventListener('click', function(){ document.getElementById('modal').classList.remove('open'); });
document.getElementById('m-save').addEventListener('click', function(){
  var folder = document.getElementById('f-folder').value.trim();
  if(!folder){ toast('폴더 경로를 입력하세요'); return; }
  var name = document.getElementById('f-name').value.trim();
  var url = document.getElementById('f-url').value.trim();
  var a = marks();
  a.unshift({id:'w' + Date.now(), name:name || nameOf(folder), url:url, folder:folder});
  saveMarks(a);
  document.getElementById('modal').classList.remove('open');
  document.getElementById('f-name').value = ''; document.getElementById('f-url').value = ''; document.getElementById('f-folder').value = '';
  render();
});

// --- 데이터 로드 --------------------------------------------------------------
function load(silent){
  return api('/__agents/workspaces').then(function(d){
    if(d && d.ok){ DATA = d; }
    route();
  }).catch(function(){
    if(!silent){ view.innerHTML = ''; view.appendChild(el('div','empty','목록을 불러오지 못했습니다.')); }
  });
}
load(false);
setInterval(function(){ if(!document.hidden && /^(#\/?)?$/.test(location.hash)) load(true); }, 30000);

// --- 테마 --------------------------------------------------------------------
(function(){
  var TK = 'xmo_theme', root = document.documentElement, box = document.getElementById('xtheme');
  function get(){ try { return localStorage.getItem(TK) || 'sepia'; } catch(e){ return 'sepia'; } }
  function paint(){ var t = get(); [].forEach.call(box.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); }); }
  box.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var t = b.getAttribute('data-t');
    try { localStorage.setItem(TK, t); } catch(_){}
    root.setAttribute('data-xtheme', t); paint();
  });
  root.setAttribute('data-xtheme', get()); paint();
})();
})();
</script>
