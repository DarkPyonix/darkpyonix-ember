<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VS Code 서버에 연결할 수 없습니다</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#efe6d8;color:#3a352e;font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif;padding:24px}
.c{max-width:420px;background:#fbf7f1;border:1px solid #e6ddd0;border-radius:16px;padding:24px;
box-shadow:0 8px 30px rgba(120,80,50,.14)}h1{font-size:17px;margin:0 0 10px;color:#b23a2e}
p{font-size:13.5px;line-height:1.7;color:#6b5f52;margin:0 0 14px}
code{display:block;background:#efe6d8;border-radius:8px;padding:10px 12px;font-size:12px;
font-family:ui-monospace,Consolas,monospace;word-break:break-all;margin-bottom:14px}
a{display:block;text-align:center;background:#b23a2e;color:#fff;text-decoration:none;
padding:12px;border-radius:10px;font-size:14px;font-weight:600}</style></head><body><div class="c">
<h1>VS Code 서버에 연결할 수 없습니다</h1>
<p>편집기 본체(<b>code serve-web</b>)가 떠 있지 않습니다. PC 에서 아래 명령을 실행한 뒤
다시 시도해 주세요. 홈 화면과 대화 기록은 이 서버만으로도 계속 볼 수 있습니다.</p>
<code>code serve-web --port 9092 --host 127.0.0.1 --without-connection-token</code>
<a href="/">홈으로 돌아가기</a></div></body></html>
