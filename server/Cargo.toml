[package]
name = "ember-server"
version = "0.1.0"
edition = "2021"
description = "Ember main server: wraps agent CLIs, stores sessions, pushes updates to clients"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
# The ember node API types and typed client (computers, FR-X1–FR-X3).
ember-node = { path = "../node" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
futures = "0.3"
libc = "0.2"
# Sign in with ChatGPT (FR-U4): OAuth token endpoint and the Responses API over HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
# Project mount, macOS server: loopback NFSv3 server (BSD-3-Clause). See src/computers/mount.rs.
nfsserve = { version = "0.11", optional = true }

# Project mount, Linux server: FUSE through fusermount3 (MIT; edition 2024, rustc >= 1.85).
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }

[features]
# Mount a Claude Code session's project directory from its computer (src/computers/mount.rs).
# macOS: `mount-nfs`; Linux: `mount-fuse` (or `mount-nfs`, which needs root to mount there).
mount-nfs = ["dep:nfsserve"]
mount-fuse = ["dep:fuser"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
