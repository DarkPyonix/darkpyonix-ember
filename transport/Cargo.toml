[package]
name = "ember-transport"
version = "0.1.0"
edition = "2021"
description = "Ember transport: peer-to-peer connections behind one interface (SPEC FR-N5); iroh backend + in-memory fake"
license = "Apache-2.0"

[features]
default = ["iroh", "http"]
# Real P2P backend (SPEC FR-N1). The only place iroh may be referenced (FR-N5).
iroh = ["dep:iroh"]
# Serve / dial HTTP (axum, hyper) over transport streams.
http = ["dep:axum", "dep:hyper", "dep:hyper-util"]
# The NFR-N1 measurement binary.
bench = ["iroh", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
ed25519-dalek = "3"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

iroh = { version = "1", optional = true }

axum = { version = "0.8", optional = true, features = ["ws"] }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }

serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[[bin]]
name = "ember-transport-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]
